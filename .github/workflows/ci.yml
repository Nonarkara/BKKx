name: Site checks

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: node --test tests/rendered-html.test.mjs
      # The world-pipeline scripts are pure arithmetic with no heavy
      # dependency, precisely so their geometry can be checked here rather
      # than only on an operator's machine with amulet-core installed.
      - name: world pipeline geometry
        working-directory: .
        run: |
          python3 scripts/test-build-hero-monument-blocks.py
          python3 scripts/test-build-rattanakosin-water-and-walls.py
          python3 scripts/test-build-shophouse-fabric.py
          # The appliers' dry runs need neither amulet nor a world, so
          # selection, dilation and reporting are all exercised here.
          python3 scripts/apply-hero-monuments-to-world.py --dry-run
          python3 scripts/apply-hero-monuments-to-world.py --dry-run --min-confidence official-envelope
          python3 scripts/apply-shophouse-fabric-to-world.py --dry-run
          python3 scripts/apply-shophouse-fabric-to-world.py --dry-run --min-confidence overture-storeys
